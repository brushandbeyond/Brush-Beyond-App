# Refreshes js/data/youtube-stats.json from the YouTube Data API once a day
# and commits it if the numbers changed. The website and the iOS app both
# read that file straight from GitHub, so they pick up new numbers without
# a redeploy or an App Store update.
#
# One-time setup: repo Settings → Secrets and variables → Actions →
# New repository secret named YOUTUBE_API_KEY (see scripts/update-youtube-stats.js).
# Run it immediately from the Actions tab → "Update YouTube stats" → Run workflow.

name: Update YouTube stats

on:
  schedule:
    - cron: '17 9 * * *' # daily, ~9:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-youtube-stats.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Commit if changed
        run: |
          git diff --quiet js/data/youtube-stats.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add js/data/youtube-stats.json
          git commit -m "Update YouTube stats"
          git push
